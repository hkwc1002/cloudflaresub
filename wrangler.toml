name = "cloudflaresub"
main = "src/worker.js"
compatibility_date = "2026-03-06"
workers_dev = true

# Persist the production subscription KV binding in source control so Git-based
# deployments reconstruct the same Worker environment every time.
[[kv_namespaces]]
binding = "SUB_STORE"
id = "0449886a6df6405084d8be462f769e34"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/sub/*"]
